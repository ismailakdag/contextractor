[workspace]
members = ["crates/contextractor-core", "crates/contextractor-cli", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.6"
edition = "2021"
license = "MIT"
repository = "https://github.com/local/contextractor"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "=3.14.0"
thiserror = "2.0"
uuid = { version = "=1.11.0", features = ["v4", "v5", "serde"] }
walkdir = "2.5"
urlencoding = "2.1"
